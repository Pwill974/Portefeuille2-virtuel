name: Mise a jour portefeuille Alpha Zen

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 1-5"

permissions:
  contents: read

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.26" "yfinance>=0.2.54" "supabase>=2.0,<3.0"

      - name: Mettre a jour le portefeuille
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PROFILE_ID: ${{ secrets.SUPABASE_PROFILE_ID }}
        run: python scripts/update_portfolio_background.py
